plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'dev.gptc.android'
    compileSdk 34

    defaultConfig {
        applicationId "dev.gptc.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            // Chaquopy supports: arm64-v8a, armeabi-v7a, x86, x86_64
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    chaquopy {
        defaultConfig {
            version "3.12"
            pip {
                install "requests"
                install "aiohttp"
                install "brotli"
                install "pycryptodome"
                install "nest-asyncio2"
                install "flask"
                install "asgiref"
                install "werkzeug"
                install "a2wsgi"
                install "certifi"
                install "pillow"
                install "cryptography"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

task copyGPTcAssets(type: Copy) {
    from("${rootDir}/../../gptc") {
        into("gptc")
        exclude "**/__pycache__", "**/*.pyc", "**/.git*"
    }
    from("${rootDir}/../../gptc.dev") {
        into("gptc.dev")
        exclude "**/node_modules", "**/.git*", "**/.venv*", "**/.wrangler"
    }
    into("src/main/assets")
}

preBuild.dependsOn copyGPTcAssets

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}

