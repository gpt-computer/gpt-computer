[project]
name = "gpt-computer"
version = "0.1.1"
description = "Specify what you want it to build, the AI asks for clarification, and then builds it."
authors = [{name = "KhulnaSoft", email = "support@khulnasoft.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "requests",
    "aiohttp",
    "brotli",
    "pycryptodome",
    "nest-asyncio2",
    "aiofiles>=23.2.1",
    "backoff>=2.2.1",
    "black>=23.3.0",
    "fastapi>=0.128.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "pillow>=10.2.0",
    "pyperclip>=1.11.0",
    "regex>=2023.12.25",
    "termcolor>=3.0.0",
    "toml>=0.10.2",
    "tomlkit>=0.14.0",
    "typer>=0.23.0",
    "openai>=1.0",
    "rudder-sdk-python>=2.0.2",
    "dataclasses-json>=0.5.7",
    "tiktoken>=0.0.4",
    "tabulate==0.9.0",
    "python-dotenv>=0.21.0",
    "langchain_openai",
    "datasets>=2.17.1",
    "langchain-google-genai>=1.0.1",
    "langchain-groq>=0.1.0",
    "langchain-mistralai>=0.1.0",
    "langchain-cohere>=0.1.4",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.40",
    "packaging>=23.2",
]
keywords = [
    "gpt-computer",
    "gpt-computer.js",
    "gptc",
    "gptc.dev",
    "javascript",
    "npm",
    "browser",
    "gpt",
    "chatgpt",
    "deepseek",
    "openai",
    "ai",
    "client",
    "sdk",
    "free",
    "ai",
    "gpt-4",
    "gpt-4o",
    "chat",
    "api",
    "browser",
    "ai",
    "js",
    "client",
    "text",
    "generation",
    "image",
    "generation",
    "in-browser",
    "ai",
    "frontend",
    "ai",
    "openai",
    "alternative",
    "javascript",
    "ai",
    "library",
    "nodejs",
    "prompt",
    "engineering",
    "chatbot",
    "ai",
    "integration",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/gpt-computer/gpt-computer"
Repository = "https://github.com/gpt-computer/gpt-computer"
Documentation = "https://gpt-computer.readthedocs.io/en/latest/"
Source-Code = "https://github.com/gpt-computer/gpt-computer"
Bug-Tracker = "https://github.com/gpt-computer/gpt-computer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gptc", "gpt_computer"]

[project.scripts]
gpt-computer = "gpt_computer.interfaces.cli.main:app"
ge = "gpt_computer.interfaces.cli.main:app"
gptc = "gptc.cli:main"
gptc-mcp = "gptc.mcp.server:main"
gptc-tray = "gptc.tray:_tray_main"
bench = "gpt_computer.benchmark.__main__:app"
gptc_test_application = "tests.caching_main:app"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
doc = [
  "autodoc_pydantic",
  "myst_parser",
  "nbsphinx",
  "sphinx",
  "sphinx-autobuild",
  "sphinx_book_theme",
  "sphinx_rtd_theme",
  "sphinx-typlog-theme",
  "myst-nb",
  "linkchecker",
  "sphinx-copybutton",
  "markdown-include",
  "sphinx_copybutton",
]
all = [
    "curl_cffi>=0.6.2",
    "certifi",
    "browser_cookie3",
    "ddgs",
    "beautifulsoup4",
    "platformdirs",
    "aiohttp_socks",
    "pillow",
    "cairosvg",
    "werkzeug",
    "flask[async]",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "a2wsgi",
    "setuptools",
    "markitdown[all]",
    "python-dotenv",
    "wasmtime",
    "numpy",
    "PyYAML",
    "pystray",
    "cryptography",
]
slim = [
    "curl_cffi>=0.6.2",
    "certifi",
    "browser_cookie3",
    "ddgs",
    "beautifulsoup4",
    "aiohttp_socks",
    "pillow",
    "werkzeug",
    "flask[async]",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "a2wsgi",
    "pypdf2",
    "python-docx",
    "python-dotenv",
    "PyYAML",
    "pystray",
    "cryptography",
]
image = [
    "pillow",
    "cairosvg",
    "beautifulsoup4",
]
api = ["loguru", "fastapi", "uvicorn", "python-multipart", "a2wsgi", "PyYAML"]
gui = [
    "werkzeug",
    "flask[async]",
    "beautifulsoup4",
    "pillow",
]
search = [
    "beautifulsoup4",
    "pillow",
    "ddgs",
]
local = ["gpt4all"]
files = [
    "beautifulsoup4",
    "markitdown[all]",
]
tray = [
    "pystray",
    "pillow",
    "cairosvg",
]

[dependency-groups]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.0.272",
    "pre-commit==3.3.3",
    "tox>=3.0.0",
]
docs = [
    "autodoc_pydantic>=1.8.0",
    "myst_parser>=0.18.1",
    "nbsphinx>=0.8.9",
    "sphinx>=5.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx_book_theme>=0.3.3",
    "sphinx_rtd_theme>=1.0.0",
    "sphinx-typlog-theme>=0.8.0",
    "toml>=0.10.2",
    "myst-nb>=0.17.1",
    "linkchecker>=10.2.1",
    "sphinx-copybutton>=0.5.1",
    "markdown-include>=0.6.0",
    "sphinx_copybutton>=0.5.2",
]

[tool.ruff]
show-fixes = false
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
task-tags = ["TODO", "FIXME"]
extend-ignore = ["E501", "E722"]

[tool.black]
target-version = ["py310"]

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = []
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
combine-as-imports = true
split-on-trailing-comma = false
lines-between-types = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--verbose",
  "--tb=short",
]
markers = [
  "requires_key: marks tests as requiring access to a valid OPENAI_API_KEY (deselect with '-m \"not requires_key\"')",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "api: marks tests related to API endpoints",
  "asyncio: marks tests as async",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["gpt_computer"]
branch = true
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__main__.py",
  "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@abstractmethod",
  "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "htmlcov"